---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: databases.kinda.rocks
spec:
  group: kinda.rocks
  names:
    kind: Database
    listKind: DatabaseList
    plural: databases
    shortNames:
    - db
    singular: database
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: current db status
      jsonPath: .status.status
      name: Status
      type: boolean
    - description: If database is protected to not get deleted.
      jsonPath: .spec.deletionProtected
      name: Protected
      type: boolean
    - description: instance reference
      jsonPath: .spec.instance
      name: DBInstance
      type: string
    - description: db-operator version of last full reconcile
      jsonPath: .status.operatorVersion
      name: OperatorVersion
      type: string
    - description: time since creation of resource
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: Database is the Schema for the databases API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: DatabaseSpec defines the desired state of Database
            properties:
              backup:
                description: DatabaseBackup defines the desired state of backup and
                  schedule
                properties:
                  cron:
                    type: string
                  enable:
                    type: boolean
                  envFromSecret:
                    type: string
                required:
                - cron
                - enable
                type: object
              cleanup:
                type: boolean
              credentials:
                description: Credentials should be used to setup everything relates
                  to k8s secrets and configmaps
                properties:
                  metadata:
                    description: |-
                      Metadata defines additional metadata that should be applied to
                      k8s resources created from credentials configuration.

                      For Database and DbUser, this metadata is applied to the Secret
                      that stores generated credentials.
                    properties:
                      extraAnnotations:
                        additionalProperties:
                          type: string
                        description: |-
                          ExtraAnnotations will be merged into the annotations of the Secret
                          created for the credentials. Existing annotations are preserved, and
                          keys from this map will overwrite annotations with the same key on
                          the Secret.
                        type: object
                      extraLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          ExtraLabels will be merged into the labels of the Secret created
                          for the credentials. Existing labels are preserved, and keys from
                          this map will overwrite labels with the same key on the Secret.
                        type: object
                    type: object
                  templates:
                    description: Templates to add custom entries to ConfigMaps and
                      Secrets
                    items:
                      description: Templates to add custom entries to ConfigMaps and
                        Secrets
                      properties:
                        name:
                          type: string
                        secret:
                          type: boolean
                        template:
                          type: string
                      required:
                      - name
                      - secret
                      - template
                      type: object
                    type: array
                type: object
              deletionProtected:
                type: boolean
              existingUser:
                description: |-
                  If specified, DB Operator will try to use an existing user to assign permissions
                  User will not be removed, when a database is removed, but the permissions added by the
                  operator will be cleaned up
                type: string
              extraGrants:
                items:
                  properties:
                    accessType:
                      type: string
                    user:
                      type: string
                  required:
                  - accessType
                  - user
                  type: object
                type: array
              instance:
                type: string
              postgres:
                description: Postgres struct should be used to provide resource that
                  only applicable to postgres
                properties:
                  dropPublicSchema:
                    description: If set to true, the public schema will be dropped
                      after the database creation
                    type: boolean
                  extensions:
                    items:
                      type: string
                    type: array
                  schemas:
                    description: Specify schemas to be created. The user created by
                      db-operator will have all access on them.
                    items:
                      type: string
                    type: array
                  template:
                    description: Let user create database from template
                    type: string
                type: object
              secretName:
                type: string
              secretsTemplates:
                additionalProperties:
                  type: string
                type: object
            required:
            - deletionProtected
            - instance
            - secretName
            type: object
          status:
            description: DatabaseStatus defines the observed state of Database
            properties:
              database:
                type: string
              engine:
                type: string
              extraGrants:
                items:
                  properties:
                    accessType:
                      type: string
                    user:
                      type: string
                  required:
                  - accessType
                  - user
                  type: object
                type: array
              monitorUserSecret:
                type: string
              operatorVersion:
                type: string
              proxyStatus:
                description: |-
                  DatabaseProxyStatus defines whether proxy for database is enabled or not
                  if so, provide information
                properties:
                  serviceName:
                    type: string
                  sqlPort:
                    format: int32
                    type: integer
                  status:
                    type: boolean
                required:
                - serviceName
                - sqlPort
                - status
                type: object
              status:
                description: |-
                  Important: Run "make generate" to regenerate code after modifying this file
                  Add custom validation using kubebuilder tags: https://book-v1.book.kubebuilder.io/beyond_basics/generating_crd.html
                type: boolean
              user:
                type: string
            required:
            - database
            - engine
            - status
            - user
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
