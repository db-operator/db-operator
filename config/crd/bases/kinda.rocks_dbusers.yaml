---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: dbusers.kinda.rocks
spec:
  group: kinda.rocks
  names:
    kind: DbUser
    listKind: DbUserList
    plural: dbusers
    singular: dbuser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: current dbuser status
      jsonPath: .status.status
      name: Status
      type: boolean
    - description: To which database user should have access
      jsonPath: .spec.databaseRef
      name: DatabaseName
      type: string
    - description: A type of access the user has
      jsonPath: .spec.accessType
      name: AccessType
      type: string
    - description: db-operator version of last full reconcile
      jsonPath: .status.operatorVersion
      name: OperatorVersion
      type: string
    - description: time since creation of resource
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: DbUser is the Schema for the dbusers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: User and access settings for the referenced Database.
            properties:
              accessType:
                description: Access level to grant. Supported values are readOnly
                  and readWrite.
                type: string
              cleanup:
                description: |-
                  Adds this DbUser as an owner of the Kubernetes resources it creates.
                  Kubernetes garbage collection then removes those resources with the DbUser.
                type: boolean
              credentials:
                description: Generated credential data and Secret metadata.
                properties:
                  metadata:
                    description: Labels and annotations on the generated credential
                      Secret.
                    properties:
                      extraAnnotations:
                        additionalProperties:
                          type: string
                        description: |-
                          Annotations to merge into the generated credential Secret.
                          Values in this map replace existing values for the same keys.
                        type: object
                      extraLabels:
                        additionalProperties:
                          type: string
                        description: |-
                          Labels to merge into the generated credential Secret.
                          Values in this map replace existing values for the same keys.
                        type: object
                    type: object
                  templates:
                    description: Additional data entries for generated Secrets and
                      ConfigMaps.
                    items:
                      description: One generated credential entry.
                      properties:
                        name:
                          description: Data key written to the generated Secret or
                            ConfigMap.
                          type: string
                        secret:
                          description: |-
                            Writes the entry to a Secret when true and to a ConfigMap when false.
                            DbUser templates must set this field to true.
                          type: boolean
                        template:
                          description: Go template evaluated with database connection
                            values and template helper functions.
                          type: string
                      required:
                      - name
                      - secret
                      - template
                      type: object
                    type: array
                type: object
              databaseRef:
                description: |-
                  Name of the Database that the user can access.
                  The Database must be in the same namespace as the DbUser.
                type: string
              existingUser:
                description: |-
                  Name of an existing database user to manage instead of creating a user.
                  The operator grants and revokes permissions for this user but does not create or delete it.
                type: string
              extraPrivileges:
                description: |-
                  Additional database roles to grant to the user.
                  Every role must also appear in the referenced DbInstance's allowedPrivileges list.
                  ALL PRIVILEGES is not allowed. This feature is experimental.
                items:
                  type: string
                type: array
              grantToAdmin:
                default: true
                description: |-
                  Grants the new user to the PostgreSQL administrator role.
                  This is commonly required when the managed administrator is not a superuser,
                  such as on Azure Database for PostgreSQL. It may need to be false when using
                  roles such as rds_iam on Amazon RDS. It has no effect on MySQL.
                type: boolean
              secretName:
