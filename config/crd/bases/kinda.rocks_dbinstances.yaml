                    - kind
                    - name
                    - namespace
                    type: object
                type: object
              google:
                description: |-
                  Google Cloud SQL instance managed through the Google API.

                  Deprecated: Use generic instead. Google instances will be removed in v1beta2.
                properties:
                  apiEndpoint:
                    description: Overrides the Google SQL Admin API endpoint.
                    type: string
                  clientSecretRef:
