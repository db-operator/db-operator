---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: dbinstances.kinda.rocks
spec:
  group: kinda.rocks
  names:
    kind: DbInstance
    listKind: DbInstanceList
    plural: dbinstances
    shortNames:
    - dbin
    singular: dbinstance
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - description: current phase
      jsonPath: .status.phase
      name: Phase
      type: string
    - description: health status
      jsonPath: .status.status
      name: Status
      type: string
    name: v1beta1
    schema:
      openAPIV3Schema:
        description: DbInstance is the Schema for the dbinstances API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Connection settings for the database server.
            properties:
              adminSecretRef:
                description: |-
                  Reference to the Secret containing database administrator credentials. The optional user key
                  defaults to postgres for PostgreSQL and root for MySQL. PostgreSQL passwords are read
                  from password, postgresql-password, or postgresql-postgres-password; MySQL passwords
                  are read from password or mysql-root-password.
                properties:
                  Name:
                    type: string
                  Namespace:
                    type: string
                required:
                - Name
                - Namespace
                type: object
              allowExtraGrants:
                description: |-
                  Permits Database resources to grant access to existing users
                  through their extraGrants field.
                type: boolean
              allowedPrivileges:
                description: |-
                  Database roles that DbUser resources may request in extraPrivileges.
                  ALL PRIVILEGES is not allowed.
                items:
                  type: string
                type: array
              backup:
                description: Storage used by Database backup jobs.
                properties:
                  bucket:
                    type: string
                required:
                - bucket
                type: object
              engine:
                description: |-
                  Database engine. Supported values are postgres and mysql.
                  This field is immutable.
                type: string
              generic:
                description: Existing database server reachable by address and port.
                properties:
                  backupHost:
                    description: BackupAddress used by backup jobs. When empty, backup
                      jobs use host.
                    type: string
                  host:
                    description: |-
                      Address db-operator uses to connect to the database server.
                      It cannot be set with hostFrom.
                    type: string
                  hostFrom:
                    description: Reference to one data entry in a Secret or ConfigMap.
                    properties:
                      key:
                        description: Data key whose value should be read.
                        type: string
                      kind:
                        description: Referenced resource kind. Supported values are
                          Secret and ConfigMap.
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - kind
                    - name
                    - namespace
                    type: object
                  port:
                    description: Database server port. It cannot be set with portFrom.
                    type: integer
                  portFrom:
                    description: Reference to one data entry in a Secret or ConfigMap.
                    properties:
                      key:
                        description: Data key whose value should be read.
                        type: string
                      kind:
                        description: Referenced resource kind. Supported values are
                          Secret and ConfigMap.
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - kind
                    - name
                    - namespace
                    type: object
                  publicIp:
                    description: |-
                      Externally reachable address exposed in generated credentials.
                      It cannot be set with publicIpFrom.
                    type: string
                  publicIpFrom:
                    description: Reference to one data entry in a Secret or ConfigMap.
                    properties:
                      key:
                        description: Data key whose value should be read.
                        type: string
                      kind:
                        description: Referenced resource kind. Supported values are
                          Secret and ConfigMap.
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - kind
                    - name
                    - namespace
                    type: object
                type: object
              google:
                description: |-
                  Google Cloud SQL instance managed through the Google API.

                  Deprecated: Use generic instead. Google instances will be removed in v1beta2.
                properties:
                  apiEndpoint:
                    description: Overrides the Google SQL Admin API endpoint.
                    type: string
                  clientSecretRef:
                    description: Reference to the Secret containing Google API client
                      credentials.
                    properties:
                      Name:
                        type: string
                      Namespace:
                        type: string
                    required:
                    - Name
                    - Namespace
                    type: object
                  configmapRef:
                    description: Reference to a ConfigMap containing the Google instance
                      configuration.
                    properties:
                      Name:
                        type: string
                      Namespace:
                        type: string
                    required:
                    - Name
                    - Namespace
                    type: object
                  instance:
                    type: string
                required:
                - configmapRef
                - instance
                type: object
              instanceVars:
                additionalProperties:
                  type: string
                description: |-
                  Provides values to credential templates through the InstanceVar function.
                  For example, a template can expose the address of a read-only PostgreSQL replica.
                type: object
              monitoring:
                description: Database monitoring settings.
                properties:
                  enabled:
                    description: Creates and configures a monitoring user for databases
                      on this instance.
                    type: boolean
                required:
                - enabled
                type: object
              sslConnection:
                description: TLS settings for connections from db-operator to the
                  database server.
                properties:
                  enabled:
                    type: boolean
                  skip-verify:
                    description: Accepts a server certificate without verifying its
                      certificate authority or hostname.
                    type: boolean
                required:
                - enabled
                - skip-verify
                type: object
            required:
            - adminSecretRef
            - engine
            type: object
          status:
            description: Observed state of the database server connection.
            properties:
              checksums:
                additionalProperties:
                  type: string
                type: object
              info:
                additionalProperties:
                  type: string
                description: Contains DB_CONN, DB_PORT, and DB_PUBLIC_IP values discovered
                  for the instance.
                type: object
              phase:
                description: One of Validating, Creating, Broadcasting, ProxyCreating,
                  or Running.
                type: string
              status:
                description: True when the operator can connect to the database server.
                type: boolean
            required:
            - phase
            - status
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
