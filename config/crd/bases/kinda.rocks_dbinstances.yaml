                    - key
                    - kind
                    - name
                    - namespace
                    type: object
                  port:
                    description: Database server port. It cannot be set with portFrom.
                    type: integer
                  portFrom:
                    description: Reference to one data entry in a Secret or ConfigMap.
                    properties:
                      key:
                        description: Data key whose value should be read.
                        type: string
                      kind:
                        description: Referenced resource kind. Supported values are
                          Secret and ConfigMap.
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - kind
                    - name
                    - namespace
                    type: object
                  publicIp:
                    description: |-
                      Externally reachable address exposed in generated credentials.
