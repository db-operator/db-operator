                properties:
                  enabled:
                    type: boolean
                  skip-verify:
                    description: Accepts a server certificate without verifying its
                      certificate authority or hostname.
                    type: boolean
                required:
                - enabled
                - skip-verify
                type: object
            required:
            - adminSecretRef
            - engine
            type: object
