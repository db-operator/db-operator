            type: string
          metadata:
            type: object
          spec:
            description: Connection settings for the database server.
            properties:
              adminSecretRef:
                description: |-
                  Reference to the Secret containing database administrator credentials. The optional user key
                  defaults to postgres for PostgreSQL and root for MySQL. PostgreSQL passwords are read
                  from password, postgresql-password, or postgresql-postgres-password; MySQL passwords
                  are read from password or mysql-root-password.
                properties:
                  Name:
                    type: string
                  Namespace:
                    type: string
                required:
                - Name
                - Namespace
                type: object
              allowExtraGrants:
                description: |-
                  Permits Database resources to grant access to existing users
                  through their extraGrants field.
                type: boolean
              allowedPrivileges:
                description: |-
                  Database roles that DbUser resources may request in extraPrivileges.
                  ALL PRIVILEGES is not allowed.
                items:
                  type: string
                type: array
              backup:
                description: Storage used by Database backup jobs.
                properties:
                  bucket:
                    type: string
                required:
                - bucket
                type: object
              engine:
                description: |-
                  Database engine. Supported values are postgres and mysql.
                  This field is immutable.
                type: string
              generic:
                description: Existing database server reachable by address and port.
                properties:
                  backupHost:
                    description: BackupAddress used by backup jobs. When empty, backup
                      jobs use host.
                    type: string
                  host:
                    description: |-
                      Address db-operator uses to connect to the database server.
                      It cannot be set with hostFrom.
                    type: string
                  hostFrom:
                    description: Reference to one data entry in a Secret or ConfigMap.
                    properties:
                      key:
                        description: Data key whose value should be read.
                        type: string
                      kind:
