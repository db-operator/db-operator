apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: native
      port: 9000
      targetPort: native
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.nativeNodePort }}
      {{- end }}
    - name: http
      port: 8123
      targetPort: http
      {{- if eq .Values.service.type "NodePort" }}
      nodePort: {{ .Values.service.httpNodePort }}
      {{- end }}
