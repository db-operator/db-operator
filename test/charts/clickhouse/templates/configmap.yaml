apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
data:
  cluster.xml: |
    <clickhouse>
      <listen_host>0.0.0.0</listen_host>
      <macros>
        <shard>01</shard>
        <replica>{{ .Release.Name }}-0</replica>
      </macros>
      <keeper_server>
        <tcp_port>9181</tcp_port>
        <server_id>1</server_id>
        <log_storage_path>/var/lib/clickhouse/coordination/log</log_storage_path>
        <snapshot_storage_path>/var/lib/clickhouse/coordination/snapshots</snapshot_storage_path>
        <raft_configuration>
          <server>
            <id>1</id>
            <hostname>localhost</hostname>
            <port>9234</port>
          </server>
        </raft_configuration>
      </keeper_server>
      <zookeeper>
        <node>
          <host>localhost</host>
          <port>9181</port>
        </node>
      </zookeeper>
      <distributed_ddl>
        <path>/clickhouse/task_queue/ddl</path>
      </distributed_ddl>
      <remote_servers>
        <{{ .Values.cluster.name }}>
          <shard>
            <internal_replication>true</internal_replication>
            <replica>
              <host>localhost</host>
              <port>9000</port>
            </replica>
          </shard>
        </{{ .Values.cluster.name }}>
      </remote_servers>
    </clickhouse>
